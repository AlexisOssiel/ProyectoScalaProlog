<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagnóstico Académico</title>
<style>
body { background-color: #f0f4f8; font-family: Arial, sans-serif; }
h2 { color: #2c3e50; text-align: center; }
form { background-color: #fff; padding: 20px; margin: 20px auto; width: 450px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
input[type="text"], input[type="number"] { padding: 8px; margin: 5px 0; width: 90%; border-radius: 5px; border: 1px solid #ccc; }
button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-size: 16px; }
button:hover { background-color: #2980b9; }
#resultado { margin-top: 20px; padding: 15px; background-color: #ecf0f1; border-radius: 5px; width: 450px; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>

<h2>Formulario de estudiante</h2>

<form id="formulario">
  Nombre: <input type="text" name="nombre"><br>
  Matrícula: <input type="text" name="matricula"><br>
  Asistencia (%): <input type="number" name="asistencia"><br>
  Promedio: <input type="number" name="promedio"><br>
  Tareas entregadas: <input type="number" name="tareas"><br>
  Participación (Alta/Media/Baja): <input type="text" name="participacion"><br>
  Horas de estudio: <input type="number" name="horas"><br>
  Entrega evidencias: <input type="checkbox" name="evidencias"><br>
  Nivel de comprensión: <input type="text" name="comprension"><br>
  Usa recursos: <input type="checkbox" name="recursos"><br>
  Trabajo en grupo: <input type="checkbox" name="grupo"><br>
  Motivación: <input type="text" name="motivacion"><br>
  Asistencia a tutorías: <input type="checkbox" name="tutorias"><br>
  Estrategia de estudio: <input type="text" name="estrategia"><br>
  <button type="submit">Diagnosticar</button>
</form>

<div id="resultado"></div>

<script>
const form = document.getElementById('formulario');
form.addEventListener('submit', e => {
  e.preventDefault();

  // Captura de datos
  const nombre = form.nombre.value;
  const asistencia = Number(form.asistencia.value);
  const promedio = Number(form.promedio.value);
  const tareas = Number(form.tareas.value);
  const horas = Number(form.horas.value);

  // Clasificación de riesgo
  let riesgo = "Bajo";
  if (promedio < 70 || asistencia < 75 || tareas < 5) riesgo = "Alto";
  else if (promedio < 85 || asistencia < 90 || tareas < 8) riesgo = "Medio";

  // Generación de recomendaciones
  const recomendaciones = [];
  if (riesgo === "Alto") {
    recomendaciones.push("Estudiar mínimo 2 horas");
    recomendaciones.push("Prepararse para examen");
    recomendaciones.push("Revisar tareas");
    if (horas < 5) recomendaciones.push("Estudiar en grupo");
  } else if (riesgo === "Medio") {
    recomendaciones.push("Prepararse para examen");
    recomendaciones.push("Revisar tareas");
    if (horas < 5) recomendaciones.push("Estudiar en grupo");
  } else {
    recomendaciones.push("Seguir con hábitos actuales");
  }

  // Mostrar resultado en HTML
  let html = `<strong>${nombre}:</strong> ${riesgo}<br><ul>`;
  for (const r of recomendaciones) {
    html += `<li>${r}</li>`;
  }
  html += "</ul>";
  document.getElementById('resultado').innerHTML = html;
});
</script>

</body>
</html>
