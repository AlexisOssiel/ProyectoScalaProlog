<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagnóstico Académico</title>
</head>
<body>
<h2>Formulario de estudiante</h2>
<form id="formulario">
  Nombre: <input type="text" name="nombre"><br>
  Asistencia: <input type="number" name="asistencia"><br>
  Promedio: <input type="number" name="promedio"><br>
  <button type="submit">Diagnosticar</button>
</form>
<div id="resultado"></div>

<script>
const form = document.getElementById('formulario')
form.addEventListener('submit', e => {
  e.preventDefault()
  fetch('/diagnosticar', { method: 'POST', body: new FormData(form) })
    .then(res => res.text())
    .then(data => document.getElementById('resultado').innerHTML = data)
})
</script>
</body>
</html>
